name: Offline Python compatibility

on: [push, pull_request]

permissions:
  contents: read

env:
  ANNO_RUN_LIVE_TESTS: "0"

jobs:
  grammar:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Preinstall CPU PyTorch so XGrammar does not pull CUDA runtime wheels.
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-test-grammar.txt
      - run: python -m annoscript.grammar_tests -v

  client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m annoscript.client_tests -q

  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-server.txt
      - run: python -m unittest discover -q
      - run: git diff --check

  cross-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: client
        with:
          python-version: "3.10"
      - uses: actions/setup-python@v5
        id: server
        with:
          python-version: "3.12"
      - run: |
          "${{ steps.client.outputs.python-path }}" -m pip install -r requirements.txt
          "${{ steps.server.outputs.python-path }}" -m pip install -r requirements-server.txt
      - run: >-
          python -m annoscript.cross_version_tests
          --client-python "${{ steps.client.outputs.python-path }}"
          --server-python "${{ steps.server.outputs.python-path }}"

      - run: >-
          "${{ steps.server.outputs.python-path }}" -m annoscript.job_cross_version_tests
          --client-python "${{ steps.client.outputs.python-path }}"
          --server-python "${{ steps.server.outputs.python-path }}"

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build && python -m twine check dist/*
      - run: |
          python -m venv /tmp/anno-installed
          /tmp/anno-installed/bin/pip install dist/*.whl
          cd /tmp
          /tmp/anno-installed/bin/python -m annoscript.client_tests -q
          /tmp/anno-installed/bin/python -c "import importlib.metadata as m; import importlib.util as u; from pathlib import Path; import annoscript; assert m.version('annoscript') == '0.1.0'; assert u.find_spec('lev') is None; assert Path(annoscript.__file__).with_name('_plan_viewer.html').is_file()"
