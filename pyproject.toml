[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "annoscript"
version = "0.2.1"
description = "AnnoScript: Programmable AI Annotation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "stevenybw"}]
dependencies = ["httpx>=0.28,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
server = ["fastapi>=0.128.1,<1", "uvicorn>=0.40,<1"]
tokenizer = ["transformers==5.17.0"]

[project.urls]
Homepage = "https://annoscript.chukonu.ai"
Repository = "https://github.com/stevenybw/annoscript"
Issues = "https://github.com/stevenybw/annoscript/issues"

[tool.hatch.build.targets.wheel]
packages = ["annoscript", "annoscript_examples"]

[tool.hatch.build.targets.sdist]
include = [
  "/annoscript", "/annoscript_examples", "/README.md", "/LICENSE",
  "/pyproject.toml", "/design_api.md", "/motivation.md", "/remote_protocol.md",
  "/.dockerignore", "/docs", "/deploy", "/job_protocol.md", "/requirements*.txt", "/third_party/xgrammar",
]
